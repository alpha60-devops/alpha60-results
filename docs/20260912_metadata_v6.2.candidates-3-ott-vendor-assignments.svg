<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630"
     role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Distinct 2017–2026 OTT assignments by vendor</title>
  <desc id="chart-desc">Horizontal bar chart of 576 non-exclusive assignments, sorted from highest to lowest. Netflix 147; Disney Plus 142; Amazon Prime Video 79; HBO Max 77; Hulu 57; Apple TV 42; Paramount Plus 22; Peacock 4; YouTube 4; Crunchyroll 1; Viu 1.</desc>

  <rect width="1000" height="630" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2937">
    <text x="24" y="34" font-size="24" font-weight="700">Distinct 2017–2026 OTT assignments by vendor</text>
    <text x="24" y="59" font-size="14">576 non-exclusive object–vendor assignments; bars sorted by assignment count</text>

    <g font-size="13" text-anchor="middle">
      <text x="250" y="86">0</text>
      <text x="450" y="86">50</text>
      <text x="650" y="86">100</text>
      <text x="850" y="86">150</text>
    </g>
    <g stroke="#6b7280" stroke-width="1" aria-hidden="true">
      <line x1="250" y1="92" x2="250" y2="582"/>
      <line x1="450" y1="92" x2="450" y2="582"/>
      <line x1="650" y1="92" x2="650" y2="582"/>
      <line x1="850" y1="92" x2="850" y2="582"/>
    </g>

    <g font-size="16">
      <text x="235" y="121" text-anchor="end">Netflix</text>
      <rect x="250" y="103" width="588" height="24" fill="#005a9c"/>
      <text x="850" y="121" font-weight="700">147</text>

      <text x="235" y="166" text-anchor="end">Disney+</text>
      <rect x="250" y="148" width="568" height="24" fill="#005a9c"/>
      <text x="830" y="166" font-weight="700">142</text>

      <text x="235" y="211" text-anchor="end">Amazon Prime Video</text>
      <rect x="250" y="193" width="316" height="24" fill="#005a9c"/>
      <text x="578" y="211" font-weight="700">79</text>

      <text x="235" y="256" text-anchor="end">HBO Max</text>
      <rect x="250" y="238" width="308" height="24" fill="#005a9c"/>
      <text x="570" y="256" font-weight="700">77</text>

      <text x="235" y="301" text-anchor="end">Hulu</text>
      <rect x="250" y="283" width="228" height="24" fill="#005a9c"/>
      <text x="490" y="301" font-weight="700">57</text>

      <text x="235" y="346" text-anchor="end">Apple TV</text>
      <rect x="250" y="328" width="168" height="24" fill="#005a9c"/>
      <text x="430" y="346" font-weight="700">42</text>

      <text x="235" y="391" text-anchor="end">Paramount+</text>
      <rect x="250" y="373" width="88" height="24" fill="#005a9c"/>
      <text x="350" y="391" font-weight="700">22</text>

      <text x="235" y="436" text-anchor="end">Peacock</text>
      <rect x="250" y="418" width="16" height="24" fill="#005a9c"/>
      <text x="278" y="436" font-weight="700">4</text>

      <text x="235" y="481" text-anchor="end">YouTube</text>
      <rect x="250" y="463" width="16" height="24" fill="#005a9c"/>
      <text x="278" y="481" font-weight="700">4</text>

      <text x="235" y="526" text-anchor="end">Crunchyroll</text>
      <rect x="250" y="508" width="4" height="24" fill="#005a9c"/>
      <text x="266" y="526" font-weight="700">1</text>

      <text x="235" y="571" text-anchor="end">Viu</text>
      <rect x="250" y="553" width="4" height="24" fill="#005a9c"/>
      <text x="266" y="571" font-weight="700">1</text>
    </g>
    <text x="550" y="612" font-size="14" text-anchor="middle">Assignment count</text>
  </g>
</svg>
